name: release

# Builds the installable packages linked from site/preuzmi/ (Android, Windows,
# Linux, unsigned iOS, ad-hoc signed macOS) and attaches them to a GitHub
# Release with fixed file names, so
# https://github.com/anjahubac/tavli/releases/latest/download/<file> always
# points at the newest version.
#
# - Push a tag `v*` (for example `git tag v1.0.0 && git push upstream v1.0.0`)
#   to build and publish a release.
# - Run it manually (Actions → release → Run workflow) to build the packages
#   as workflow artifacts only; nothing is published. A PR that changes this
#   file does the same, so the builds are proven before merge.
#
# Build-time config comes from repository secrets SUPABASE_URL and
# SUPABASE_ANON_KEY (the public anon key; access is enforced by RLS). Without
# them the packages still build, but sign-in is unavailable. No provider keys
# go into the app (constitution IV).

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  android:
    name: android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, AUTH_CONFIRM_PAGE_URL: "https://welcome.tavli.workers.dev/potvrda/"}' \
            > "$RUNNER_TEMP/release-config.json"
      - run: flutter pub get
      # Release builds are still signed with the debug key (android/app/build.gradle.kts).
      - run: flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/release-config.json"
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/tavli-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, AUTH_CONFIRM_PAGE_URL: "https://welcome.tavli.workers.dev/potvrda/"}' \
            > "$RUNNER_TEMP/release-config.json"
      - run: flutter pub get
      - run: flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/release-config.json"
      - name: Package
        run: |
          bundle=build/linux/x64/release/bundle
          # Lets `./register-links.sh .` open tavli:// links (email confirmation) in this bundle.
          cp scripts/linux-register-links.sh "$bundle/register-links.sh"
          mkdir -p dist
          tar -czf dist/tavli-linux-x64.tar.gz -C build/linux/x64/release --transform 's,^bundle,tavli,' bundle
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write build config
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          @{
            SUPABASE_URL = "$env:SUPABASE_URL"
            SUPABASE_ANON_KEY = "$env:SUPABASE_ANON_KEY"
            AUTH_CONFIRM_PAGE_URL = 'https://welcome.tavli.workers.dev/potvrda/'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\release-config.json"
      - run: flutter pub get
      - run: flutter build windows --release "--dart-define-from-file=$env:RUNNER_TEMP\release-config.json"
        shell: pwsh
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $staging = Join-Path $env:RUNNER_TEMP 'tavli'
          Copy-Item -Recurse build\windows\x64\runner\Release $staging
          Compress-Archive -Path $staging -DestinationPath dist\tavli-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: ios-ipa
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, AUTH_CONFIRM_PAGE_URL: "https://welcome.tavli.workers.dev/potvrda/"}' \
            > "$RUNNER_TEMP/release-config.json"
      - run: flutter pub get
      # No Apple Developer account yet: the IPA is unsigned and is installed by
      # re-signing it with the user's own Apple ID (AltStore, Sideloadly).
      - run: flutter build ios --release --no-codesign --dart-define-from-file="$RUNNER_TEMP/release-config.json"
      - name: Package
        run: |
          staging="$RUNNER_TEMP/ipa"
          mkdir -p "$staging/Payload" dist
          cp -R build/ios/iphoneos/Runner.app "$staging/Payload/"
          (cd "$staging" && zip -qry "$GITHUB_WORKSPACE/dist/tavli-ios.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-ios
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos-dmg
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write build config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, AUTH_CONFIRM_PAGE_URL: "https://welcome.tavli.workers.dev/potvrda/"}' \
            > "$RUNNER_TEMP/release-config.json"
      - run: flutter pub get
      # No Developer ID yet: without Local.xcconfig the app is ad-hoc signed and
      # not notarized, so Gatekeeper asks once ("Open Anyway"); site/preuzmi/ says how.
      - run: flutter build macos --release --dart-define-from-file="$RUNNER_TEMP/release-config.json"
      - name: Package
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging" dist
          cp -R build/macos/Build/Products/Release/tavli.app "$staging/Tavli.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Tavli -srcfolder "$staging" -format UDZO -ov dist/tavli-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, ios, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tavli-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Tavli $TAG" --generate-notes --latest
          fi

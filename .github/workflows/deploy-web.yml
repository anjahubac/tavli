# Gradi web aplikaciju (spec 036) protiv produkcije i objavljuje je kao Cloudflare Worker.
# Samo push na main (izdanje dev → main), uz odobrenje u okruženju "production".
# Vrednosti žive u GitHub okruženju "production", ne u repou:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: SUPABASE_URL, SUPABASE_ANON_KEY, WEB_AUTH_REDIRECT_URL
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "packages/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "web.wrangler.jsonc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (production)
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (production values)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          WEB_AUTH_REDIRECT_URL: ${{ vars.WEB_AUTH_REDIRECT_URL }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" && test -n "$WEB_AUTH_REDIRECT_URL"
          flutter build web --wasm --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=WEB_AUTH_REDIRECT_URL="$WEB_AUTH_REDIRECT_URL"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config web.wrangler.jsonc

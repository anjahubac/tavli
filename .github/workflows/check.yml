name: check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: scripts/check.sh
      - run: flutter test
      - name: flutter test (packages/tavli_ui)
        working-directory: packages/tavli_ui
        # Uključuje testove izgleda (slike); porede se samo na Linuxu.
        run: flutter test
      - name: razlike u slikama izgleda
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/tavli_ui/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-docs.py

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Regression tests for every repository script (scripts/test_*.py).
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

name: check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-functions:
    name: deno-functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # The Supabase edge runtime is compatible with Deno 2.1. Testing on
          # the latest 2.x hid that Uint8Array.fromBase64 is missing there.
          deno-version: 2.1.x
          cache: true
      - run: deno test supabase/functions

  linux-build:
    name: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Build broj paketa je broj commitova (scripts/build-linux.sh).
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: desktop-file-validate linux/packaging/com.tavli.tavli.desktop
      # Bez secrets: paket bez konfiguracije naloga, samo provera pakovanja.
      - run: scripts/build-linux.sh --ci
      - name: Install and inspect the package
        run: |
          deb=$(ls build/linux/deb/tavli_*_amd64.deb)
          (cd build/linux/deb && sha256sum --check ./*.sha256)
          dpkg-deb --info "$deb"
          sudo apt-get install --yes --no-install-recommends "./$deb"
          test -x /opt/tavli/tavli
          test "$(readlink -f /usr/bin/tavli)" = /opt/tavli/tavli
          test -f /usr/share/icons/hicolor/256x256/apps/com.tavli.tavli.png
          grep -q 'x-scheme-handler/tavli=com.tavli.tavli.desktop' /usr/share/applications/mimeinfo.cache
          if ldd /opt/tavli/tavli /opt/tavli/lib/*.so | grep 'not found'; then exit 1; fi
          sudo apt-get remove --yes tavli
          test ! -e /opt/tavli/tavli
      - uses: actions/upload-artifact@v7
        with:
          name: tavli-linux-deb
          path: build/linux/deb/
          if-no-files-found: error
          retention-days: 7

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: scripts/check.sh
      - run: flutter test
      - name: flutter test (packages/tavli_ui)
        working-directory: packages/tavli_ui
        # Uključuje testove izgleda (slike); porede se samo na Linuxu.
        run: flutter test
      - name: razlike u slikama izgleda
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/tavli_ui/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      # Bez tajni: URL i ključ Supabase-a nisu potrebni da bi se web kompajlirao.
      - run: flutter build web --wasm --release --no-web-resources-cdn
      - name: Testovi samo za web
        run: flutter test --platform chrome test/data/indexed_db_recipe_photo_store_test.dart
      - name: Instalacija zahteva drift fajlove i zaglavlja
        run: |
          test -f build/web/sqlite3.wasm
          test -f build/web/drift_worker.js
          test -f build/web/_headers
          # CSP dozvoljava skripte samo sa našeg domena: engine mora biti lokalan.
          grep -q '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js
          test -f build/web/canvaskit/skwasm.wasm

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-docs.py

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Regression tests for every repository script (scripts/test_*.py).
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

# Naziv grane i naslov PR-a po pravilima iz docs/flutter-best-practices.md §17.
# Imena poslova (branch-name, pr-title) su obavezne provere u ruleset-ima.
name: pr-conventions

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ "$BASE" == "main" ]]; then
            # U main ulazi samo izdanje iz dev-a ili hitna ispravka.
            if [[ "$HEAD" == "dev" || "$HEAD" =~ ^hotfix/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              exit 0
            fi
            echo "::error::PR u main mora doći iz 'dev' ili 'hotfix/…' (sada: '$HEAD')."
            exit 1
          fi
          # Vraćanje hitne ispravke iz main-a u dev, i Dependabot.
          if [[ "$HEAD" == "main" || "$HEAD" == dependabot/* ]]; then
            exit 0
          fi
          pattern='^([0-9]{3}[a-z]?-[a-z0-9]+(-[a-z0-9]+)*|(feat|fix|chore|docs|refactor|perf|test|ci|spec)/[a-z0-9]+(-[a-z0-9]+)*)$'
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "::error::Grana '$HEAD' ne prati pravila (docs/flutter-best-practices.md §17):"
            echo "::error::NNN-short-name ili feat|fix|chore|docs|refactor|perf|test|ci|spec/short-name"
            exit 1
          fi

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.head_ref }}
          LC_ALL: C.UTF-8
        run: |
          # PR izdanja (dev → main) i vraćanje main → dev spajaju se merge
          # commit-om; naslov je slobodan.
          if [[ "$HEAD" == "dev" || "$HEAD" == "main" ]]; then
            exit 0
          fi
          pattern='^(feat|fix|chore|docs|refactor|perf|test|ci|build|style|revert|spec)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Naslov PR-a '$TITLE' ne prati format 'type(scope): opis' (§17)."
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::Naslov PR-a ima ${#TITLE} znakova; najviše 72."
            exit 1
          fi
